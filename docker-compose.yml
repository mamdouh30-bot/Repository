
version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    restart: unless-stopped
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [redis]
    restart: unless-stopped
    volumes: [./:/app]
volumes:
  redis_data:
