
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>دخول الأدمن</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}</style>
</head>
<body class="bg-[#0A0A0B] text-white min-h-screen flex items-center justify-center">
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-8 w-full max-w-md">
<h1 class="text-2xl font-bold">🔐 لوحة الأدمن - الموظف الخارق</h1>
<p class="opacity-60 text-sm mt-2">أدخل كلمة سر الأدمن من .env (ADMIN_PASSWORD)</p>
{% if error %}<div class="mt-4 bg-red-500/20 border border-red-500/30 p-3 rounded-xl text-sm">{{ error }}</div>{% endif %}
<form method="post" class="mt-6">
<input name="password" type="password" placeholder="كلمة السر" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3">
<button class="w-full mt-4 bg-white text-black font-bold py-3 rounded-xl">دخول</button>
</form>
</div>
</body>
</html>
